<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Биржа Заказов</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f3f4f6;
        color:#222;
    }

    header{
        background:#2563eb;
        color:white;
        padding:20px;
        text-align:center;
        font-size:28px;
        font-weight:bold;
    }

    .container{
        max-width:1100px;
        margin:30px auto;
        padding:20px;
    }

    .card{
        background:white;
        border-radius:14px;
        padding:20px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
        margin-bottom:20px;
    }

    h2{
        margin-bottom:15px;
        color:#2563eb;
    }

    input, textarea, select{
        width:100%;
        padding:12px;
        margin-top:10px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:15px;
    }

    textarea{
        resize:vertical;
        min-height:100px;
    }

    button{
        background:#2563eb;
        color:white;
        border:none;
        padding:12px 18px;
        border-radius:10px;
        cursor:pointer;
        margin-top:15px;
        font-size:15px;
        transition:0.2s;
    }

    button:hover{
        background:#1d4ed8;
    }

    .hidden{
        display:none;
    }

    .topbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
    }

    .order{
        border:1px solid #ddd;
        padding:15px;
        border-radius:12px;
        margin-top:15px;
    }

    .badge{
        display:inline-block;
        padding:6px 12px;
        border-radius:20px;
        background:#dbeafe;
        color:#1e40af;
        font-size:13px;
        margin-bottom:10px;
    }

    .price{
        font-size:22px;
        color:green;
        font-weight:bold;
        margin-top:10px;
    }

    .accepted{
        background:#dcfce7;
        color:#166534;
        padding:8px;
        border-radius:8px;
        margin-top:10px;
    }

    .role{
        font-weight:bold;
        color:#2563eb;
    }

    .logout{
        background:#ef4444;
    }

    .logout:hover{
        background:#dc2626;
    }

</style>
</head>
<body>

<header>
    Биржа Заказов
</header>

<div class="container">

    <!-- АВТОРИЗАЦИЯ -->
    <div id="authBlock" class="card">
        <h2>Вход / Регистрация</h2>

        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">

        <select id="role">
            <option value="customer">Заказчик</option>
            <option value="executor">Исполнитель</option>
        </select>

        <button onclick="register()">Регистрация</button>
        <button onclick="login()">Вход</button>
    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div id="app" class="hidden">

        <div class="topbar">
            <div>
                Вы вошли как:
                <span id="currentUser"></span>
                (<span class="role" id="currentRole"></span>)
            </div>

            <button class="logout" onclick="logout()">Выйти</button>
        </div>

        <!-- ФОРМА СОЗДАНИЯ ЗАКАЗА -->
        <div id="customerPanel" class="card hidden">
            <h2>Создать заказ</h2>

            <input type="text" id="orderTitle" placeholder="Название заказа">

            <select id="orderCategory">
                <option>Для дома</option>
                <option>Доставка</option>
                <option>Работы</option>
                <option>Другое</option>
            </select>

            <textarea id="orderDescription" placeholder="Описание заказа"></textarea>

            <input type="number" id="orderPrice" placeholder="Цена">

            <input type="text" id="orderPlace" placeholder="Место">

            <input type="text" id="orderContact" placeholder="Контактная информация">

            <button onclick="createOrder()">Добавить заказ</button>
        </div>

        <!-- СПИСОК ЗАКАЗОВ -->
        <div class="card">
            <h2>Все заказы</h2>

            <div id="ordersList"></div>
        </div>

    </div>

</div>

<script>

    // ЛОКАЛЬНАЯ БАЗА
    let users = JSON.parse(localStorage.getItem("users")) || [];
    let orders = JSON.parse(localStorage.getItem("orders")) || [];
    let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;

    // СОХРАНЕНИЕ
    function saveUsers(){
        localStorage.setItem("users", JSON.stringify(users));
    }

    function saveOrders(){
        localStorage.setItem("orders", JSON.stringify(orders));
    }

    function saveCurrentUser(){
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
    }

    // РЕГИСТРАЦИЯ
    function register(){

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const role = document.getElementById("role").value;

        if(!username || !password){
            alert("Заполните все поля");
            return;
        }

        const exists = users.find(u => u.username === username);

        if(exists){
            alert("Пользователь уже существует");
            return;
        }

        users.push({
            username,
            password,
            role
        });

        saveUsers();

        alert("Регистрация успешна!");
    }

    // ВХОД
    function login(){

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        const user = users.find(u =>
            u.username === username &&
            u.password === password
        );

        if(!user){
            alert("Неверный логин или пароль");
            return;
        }

        currentUser = user;
        saveCurrentUser();

        showApp();
    }

    // ВЫХОД
    function logout(){
        currentUser = null;
        localStorage.removeItem("currentUser");

        document.getElementById("authBlock").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
    }

    // ПОКАЗ САЙТА
    function showApp(){

        document.getElementById("authBlock").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

        document.getElementById("currentUser").innerText = currentUser.username;
        document.getElementById("currentRole").innerText =
            currentUser.role === "customer"
            ? "Заказчик"
            : "Исполнитель";

        // Показываем панель заказчика
        if(currentUser.role === "customer"){
            document.getElementById("customerPanel").classList.remove("hidden");
        } else {
            document.getElementById("customerPanel").classList.add("hidden");
        }

        renderOrders();
    }

    // СОЗДАНИЕ ЗАКАЗА
    function createOrder(){

        const title = document.getElementById("orderTitle").value;
        const category = document.getElementById("orderCategory").value;
        const description = document.getElementById("orderDescription").value;
        const price = document.getElementById("orderPrice").value;
        const place = document.getElementById("orderPlace").value;
        const contact = document.getElementById("orderContact").value;

        if(!title || !description || !price || !place || !contact){
            alert("Заполните все поля");
            return;
        }

        orders.unshift({
            id: Date.now(),
            title,
            category,
            description,
            price,
            place,
            contact,
            customer: currentUser.username,
            acceptedBy: null
        });

        saveOrders();

        renderOrders();

        document.getElementById("orderTitle").value = "";
        document.getElementById("orderDescription").value = "";
        document.getElementById("orderPrice").value = "";
        document.getElementById("orderPlace").value = "";
        document.getElementById("orderContact").value = "";
    }

    // ПРИНЯТЬ ЗАКАЗ
    function acceptOrder(id){

        const order = orders.find(o => o.id === id);

        if(order.acceptedBy){
            alert("Заказ уже принят");
            return;
        }

        order.acceptedBy = currentUser.username;

        saveOrders();

        renderOrders();
    }

    // ОТОБРАЖЕНИЕ ЗАКАЗОВ
    function renderOrders(){

        const list = document.getElementById("ordersList");

        list.innerHTML = "";

        if(orders.length === 0){
            list.innerHTML = "<p>Пока заказов нет</p>";
            return;
        }

        orders.forEach(order => {

            const div = document.createElement("div");
            div.className = "order";

            div.innerHTML = `
                <div class="badge">${order.category}</div>

                <h3>${order.title}</h3>

                <p><b>Описание:</b> ${order.description}</p>

                <p><b>Место:</b> ${order.place}</p>

                <p><b>Контакты:</b> ${order.contact}</p>

                <p><b>Заказчик:</b> ${order.customer}</p>

                <div class="price">${order.price} €</div>
            `;

            // Если заказ принят
            if(order.acceptedBy){
                div.innerHTML += `
                    <div class="accepted">
                        Заказ принял: ${order.acceptedBy}
                    </div>
                `;
            }

            // Кнопка принятия для исполнителя
            if(
                currentUser.role === "executor" &&
                !order.acceptedBy
            ){
                const btn = document.createElement("button");
                btn.innerText = "Принять заказ";

                btn.onclick = () => acceptOrder(order.id);

                div.appendChild(btn);
            }

            list.appendChild(div);
        });
    }

    // АВТОВХОД
    if(currentUser){
        showApp();
    }

</script>

</body>
</html>
