<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Биржа Заказов</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#222;
}

header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:15px;
    color:#2563eb;
}

input, textarea, select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-top:10px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    transition:0.2s;
    font-size:15px;
}

button:hover{
    background:#1d4ed8;
}

.logout{
    background:#ef4444;
}

.logout:hover{
    background:#dc2626;
}

.deleteBtn{
    background:#dc2626;
}

.deleteBtn:hover{
    background:#b91c1c;
}

.publishBtn{
    background:#16a34a;
}

.publishBtn:hover{
    background:#15803d;
}

.hidden{
    display:none;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.role{
    font-weight:bold;
    color:#2563eb;
}

.order{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.badge{
    display:inline-block;
    background:#dbeafe;
    color:#1e40af;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

.accepted{
    background:#dcfce7;
    color:#166534;
    padding:8px;
    border-radius:8px;
    margin-top:10px;
}

.notPublished{
    background:#fef3c7;
    color:#92400e;
    padding:8px;
    border-radius:8px;
    margin-top:10px;
}

.adminPanel{
    margin-top:15px;
    display:flex;
    gap:10px;
}

</style>
</head>

<body>

<header>
    Биржа Заказов
</header>

<div class="container">

    <!-- АВТОРИЗАЦИЯ -->
    <div class="card" id="authBlock">

        <h2>Вход / Регистрация</h2>

        <input type="text" id="username" placeholder="Логин">

        <input type="password" id="password" placeholder="Пароль">

        <select id="role">
            <option value="customer">Заказчик</option>
            <option value="executor">Исполнитель</option>
        </select>

        <button onclick="register()">Регистрация</button>

        <button onclick="login()">Вход</button>

        <p style="margin-top:15px;color:gray;">
            Админ:
            <b>admin</b> /
            <b>admin</b>
        </p>

    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div id="app" class="hidden">

        <div class="topbar">

            <div>
                Вы вошли как:
                <span id="currentUser"></span>
                (<span class="role" id="currentRole"></span>)
            </div>

            <button class="logout" onclick="logout()">Выйти</button>

        </div>

        <!-- ПАНЕЛЬ ЗАКАЗЧИКА -->
        <div class="card hidden" id="customerPanel">

            <h2>Создать заказ</h2>

            <input type="text" id="orderTitle" placeholder="Название заказа">

            <select id="orderCategory">
                <option>Для дома</option>
                <option>Доставка</option>
                <option>Работы</option>
                <option>Другое</option>
            </select>

            <textarea id="orderDescription" placeholder="Описание"></textarea>

            <input type="number" id="orderPrice" placeholder="Цена">

            <input type="text" id="orderPlace" placeholder="Место">

            <input type="text" id="orderContact" placeholder="Контактная информация">

            <button onclick="createOrder()">Добавить заказ</button>

        </div>

        <!-- СПИСОК ЗАКАЗОВ -->
        <div class="card">

            <h2>Все заказы</h2>

            <div id="ordersList"></div>

        </div>

    </div>

</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];
let orders = JSON.parse(localStorage.getItem("orders")) || [];
let currentUser = JSON.parse(localStorage.getItem("currentUser")) || null;

// СОЗДАЕМ АДМИНА
if(!users.find(u => u.username === "admin")){

    users.push({
        username:"admin",
        password:"admin",
        role:"admin"
    });

    saveUsers();
}

// СОХРАНЕНИЕ
function saveUsers(){
    localStorage.setItem("users", JSON.stringify(users));
}

function saveOrders(){
    localStorage.setItem("orders", JSON.stringify(orders));
}

function saveCurrentUser(){
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
}

// РЕГИСТРАЦИЯ
function register(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const role =
        document.getElementById("role").value;

    if(!username || !password){
        alert("Заполните поля");
        return;
    }

    if(username === "admin"){
        alert("Этот логин запрещен");
        return;
    }

    const exists =
        users.find(u => u.username === username);

    if(exists){
        alert("Пользователь уже существует");
        return;
    }

    users.push({
        username,
        password,
        role
    });

    saveUsers();

    alert("Регистрация успешна");
}

// ВХОД
function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const user =
        users.find(u =>
            u.username === username &&
            u.password === password
        );

    if(!user){
        alert("Неверный логин или пароль");
        return;
    }

    currentUser = user;

    saveCurrentUser();

    showApp();
}

// ВЫХОД
function logout(){

    currentUser = null;

    localStorage.removeItem("currentUser");

    document.getElementById("authBlock")
        .classList.remove("hidden");

    document.getElementById("app")
        .classList.add("hidden");
}

// ПОКАЗ САЙТА
function showApp(){

    document.getElementById("authBlock")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    document.getElementById("currentUser")
        .innerText = currentUser.username;

    let roleText = "";

    if(currentUser.role === "customer"){
        roleText = "Заказчик";
    }

    if(currentUser.role === "executor"){
        roleText = "Исполнитель";
    }

    if(currentUser.role === "admin"){
        roleText = "Администратор";
    }

    document.getElementById("currentRole")
        .innerText = roleText;

    // ПАНЕЛЬ СОЗДАНИЯ ЗАКАЗОВ
    if(currentUser.role === "customer"){

        document.getElementById("customerPanel")
            .classList.remove("hidden");

    } else {

        document.getElementById("customerPanel")
            .classList.add("hidden");
    }

    renderOrders();
}

// СОЗДАТЬ ЗАКАЗ
function createOrder(){

    const title =
        document.getElementById("orderTitle").value;

    const category =
        document.getElementById("orderCategory").value;

    const description =
        document.getElementById("orderDescription").value;

    const price =
        document.getElementById("orderPrice").value;

    const place =
        document.getElementById("orderPlace").value;

    const contact =
        document.getElementById("orderContact").value;

    if(
        !title ||
        !description ||
        !price ||
        !place ||
        !contact
    ){
        alert("Заполните все поля");
        return;
    }

    // НОВЫЙ ЗАКАЗ
    orders.unshift({

        id:Date.now(),

        title,
        category,
        description,
        price,
        place,
        contact,

        customer:currentUser.username,

        acceptedBy:null,

        published:false

    });

    saveOrders();

    renderOrders();

    document.getElementById("orderTitle").value = "";
    document.getElementById("orderDescription").value = "";
    document.getElementById("orderPrice").value = "";
    document.getElementById("orderPlace").value = "";
    document.getElementById("orderContact").value = "";
}

// ПРИНЯТЬ ЗАКАЗ
function acceptOrder(id){

    const order =
        orders.find(o => o.id === id);

    if(order.acceptedBy){
        alert("Заказ уже принят");
        return;
    }

    order.acceptedBy = currentUser.username;

    saveOrders();

    renderOrders();
}

// ОПУБЛИКОВАТЬ
function publishOrder(id){

    const order =
        orders.find(o => o.id === id);

    order.published = true;

    saveOrders();

    renderOrders();
}

// УДАЛИТЬ
function deleteOrder(id){

    if(!confirm("Удалить заказ?")){
        return;
    }

    orders =
        orders.filter(o => o.id !== id);

    saveOrders();

    renderOrders();
}

// ОТОБРАЖЕНИЕ
function renderOrders(){

    const list =
        document.getElementById("ordersList");

    list.innerHTML = "";

    // ФИЛЬТР
    let visibleOrders = orders;

    // Для исполнителей показываем только опубликованные
    if(currentUser.role === "executor"){

        visibleOrders =
            orders.filter(o => o.published);
    }

    // Для заказчиков показываем только свои
    if(currentUser.role === "customer"){

        visibleOrders =
            orders.filter(o =>
                o.customer === currentUser.username
            );
    }

    if(visibleOrders.length === 0){

        list.innerHTML =
            "<p>Заказов пока нет</p>";

        return;
    }

    visibleOrders.forEach(order => {

        const div =
            document.createElement("div");

        div.className = "order";

        div.innerHTML = `

            <div class="badge">
                ${order.category}
            </div>

            <h3>${order.title}</h3>

            <p>
                <b>Описание:</b>
                ${order.description}
            </p>

            <p>
                <b>Место:</b>
                ${order.place}
            </p>

            <p>
                <b>Контакты:</b>
                ${order.contact}
            </p>

            <p>
                <b>Заказчик:</b>
                ${order.customer}
            </p>

            <div class="price">
                ${order.price} €
            </div>
        `;

        // НЕ ОПУБЛИКОВАН
        if(!order.published){

            div.innerHTML += `
                <div class="notPublished">
                    Ожидает публикации админом
                </div>
            `;
        }

        // ПРИНЯТ
        if(order.acceptedBy){

            div.innerHTML += `
                <div class="accepted">
                    Заказ принял:
                    ${order.acceptedBy}
                </div>
            `;
        }

        // ИСПОЛНИТЕЛЬ
        if(
            currentUser.role === "executor" &&
            order.published &&
            !order.acceptedBy
        ){

            const btn =
                document.createElement("button");

            btn.innerText = "Принять заказ";

            btn.onclick = () =>
                acceptOrder(order.id);

            div.appendChild(btn);
        }

        // АДМИН
        if(currentUser.role === "admin"){

            const panel =
                document.createElement("div");

            panel.className = "adminPanel";

            // КНОПКА ПУБЛИКАЦИИ
            if(!order.published){

                const publishBtn =
                    document.createElement("button");

                publishBtn.className = "publishBtn";

                publishBtn.innerText =
                    "Опубликовать";

                publishBtn.onclick = () =>
                    publishOrder(order.id);

                panel.appendChild(publishBtn);
            }

            // КНОПКА УДАЛЕНИЯ
            const deleteBtn =
                document.createElement("button");

            deleteBtn.className = "deleteBtn";

            deleteBtn.innerText = "Удалить";

            deleteBtn.onclick = () =>
                deleteOrder(order.id);

            panel.appendChild(deleteBtn);

            div.appendChild(panel);
        }

        list.appendChild(div);
    });
}

// АВТОВХОД
if(currentUser){
    showApp();
}

</script>

</body>
</html>
