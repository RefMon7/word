<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Биржа Заказов</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
    background:#111214;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left,#2f2f35,transparent 30%),
        radial-gradient(circle at bottom right,#1d1d22,transparent 30%),
        linear-gradient(180deg,#111214,#0b0b0d);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    backdrop-filter:blur(80px);
    z-index:-1;
}

header{
    text-align:center;
    padding:35px 20px;
    font-size:34px;
    font-weight:700;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* CARD */
.card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border-radius:30px;
    padding:24px;
    margin-bottom:25px;
    box-shadow:
        0 10px 40px rgba(0,0,0,0.45),
        inset 0 1px 1px rgba(255,255,255,0.08);
}

h2{
    margin-bottom:18px;
    font-size:24px;
}

/* INPUT */
input,
textarea,
select{
    width:100%;
    margin-top:12px;
    padding:16px 18px;
    border:none;
    outline:none;
    border-radius:20px;
    background:rgba(255,255,255,0.06);
    color:white;
    border:1px solid rgba(255,255,255,0.08);
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#9ca3af;
}

/* BUTTON */
button{
    border:none;
    cursor:pointer;
    padding:15px 22px;
    border-radius:20px;
    font-size:15px;
    font-weight:600;
    margin-top:15px;
    transition:0.25s;
}

.loginBtn{
    background:white;
    color:black;
}

.loginBtn:hover{
    background:#ececec;
    transform:translateY(-2px);
}

.registerBtn{
    background:#2b2b31;
    color:white;
}

.registerBtn:hover{
    background:#3b3b42;
    transform:translateY(-2px);
}

.subscribeBtn{
    background:#14532d;
    color:white;
}

.subscribeBtn:hover{
    background:#166534;
}

.publishBtn{
    background:#1d4ed8;
    color:white;
}

.publishBtn:hover{
    background:#2563eb;
}

.deleteBtn{
    background:#7f1d1d;
    color:white;
}

.deleteBtn:hover{
    background:#991b1b;
}

.logout{
    background:#2b2b31;
    color:white;
}

.logout:hover{
    background:#3b3b42;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.role{
    color:#d1d5db;
}

.hidden{
    display:none !important;
}

/* ORDER */
.order{
    margin-top:18px;
    padding:20px;
    border-radius:24px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    color:#d4d4d8;
    font-size:13px;
    margin-bottom:14px;
}

.price{
    margin-top:14px;
    font-size:26px;
    font-weight:700;
}

.accepted{
    margin-top:14px;
    background:rgba(34,197,94,0.12);
    color:#86efac;
    padding:12px;
    border-radius:16px;
}

.notPublished{
    margin-top:14px;
    background:rgba(234,179,8,0.12);
    color:#fde68a;
    padding:12px;
    border-radius:16px;
}

/* PROFILE */
.profileCard{
    margin-top:18px;
    padding:20px;
    border-radius:24px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
}

.profileName{
    font-size:22px;
    font-weight:700;
}

.profileInfo{
    margin-top:10px;
    color:#d1d5db;
    line-height:1.6;
}

.adminPanel{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.subscriptionBox{
    margin-top:15px;
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
}

@media(max-width:700px){

    .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

}
    /* ВСТАВЬ В САМЫЙ НИЗ <style> */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:20px;
}

.modalContent{
    width:100%;
    max-width:450px;
    background:rgba(20,20,22,0.96);
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(25px);
    border-radius:30px;
    padding:30px;
    box-shadow:
        0 10px 40px rgba(0,0,0,0.45);
}

</style>
</head>

<body>

<header>
    Биржа Заказов
</header>

<div class="container">

    <!-- AUTH -->
    <div class="card" id="authBlock">

        <h2>Вход / Регистрация</h2>

        <input type="text"
               id="username"
               placeholder="Логин">

        <input type="password"
               id="password"
               placeholder="Пароль">

        <select id="role">
            <option value="customer">Заказчик</option>
            <option value="executor">Исполнитель</option>
        </select>

        

<button class="registerBtn"

        onclick="openRegisterModal()">

    Регистрация

</button>

        <button class="loginBtn"
                onclick="login()">
            Войти
        </button>

        <p style="margin-top:15px;color:#9ca3af;">
            Админ:
            <b>admin</b> /
            <b>admin</b>
        </p>

    </div>

    <!-- APP -->
    <div id="app" class="hidden">

        <div class="topbar">

            <div>
                Вы вошли как:
                <span id="currentUser"></span>
                (<span class="role"
                       id="currentRole"></span>)
            </div>

            <button class="logout"
                    onclick="logout()">
                Выйти
            </button>

        </div>

        <!-- SUB -->
        <div class="card hidden"
             id="subscriptionPanel">

            <h2>
                Подписка исполнителя
            </h2>

            <div class="subscriptionBox">

                <h3>
                    Premium Executor
                </h3>

                <p style="margin-top:10px;color:#d1d5db;">
                    Доступ ко всем заказам
                    за 15€ в месяц
                </p>

                <button class="subscribeBtn"
                        onclick="buySubscription()">
                    Купить за 15€
                </button>

                <div id="subscriptionStatus"></div>

            </div>

        </div>

        <!-- EXECUTOR PROFILE -->
        <div class="card hidden"
             id="executorProfilePanel">

            <h2>
                Профиль исполнителя
            </h2>

            <input type="text"
                   id="executorName"
                   placeholder="Имя">

            <input type="text"
                   id="executorPhone"
                   placeholder="Телефон">

            <input type="text"
                   id="executorLocation"
                   placeholder="Место">

            <!-- CATEGORY -->
            <select id="executorCategory">

                <option>
                    Для дома
                </option>

                <option>
                    Доставка
                </option>

                <option>
                    Работы
                </option>

                <option>
                    Другое
                </option>

            </select>

            <textarea id="executorDescription"
                      placeholder="Информация о себе"></textarea>

            <button class="loginBtn"
                    onclick="saveExecutorProfile()">
                Сохранить профиль
            </button>

        </div>

        <!-- CUSTOMER -->
        <div class="card hidden"
             id="customerPanel">

            <h2>
                Создать заказ
            </h2>

            <input type="text"
                   id="orderTitle"
                   placeholder="Название заказа">

            <select id="orderCategory">

                <option>
                    Для дома
                </option>

                <option>
                    Доставка
                </option>

                <option>
                    Работы
                </option>

                <option>
                    Другое
                </option>

            </select>

            <textarea id="orderDescription"
                      placeholder="Описание"></textarea>

            <input type="number"
                   id="orderPrice"
                   placeholder="Цена">

            <input type="text"
                   id="orderPlace"
                   placeholder="Место">

            <input type="text"
                   id="orderContact"
                   placeholder="Контакты">

            <button class="loginBtn"
                    onclick="createOrder()">
                Добавить заказ
            </button>

        </div>

        <!-- EXECUTORS -->
        <div class="card hidden"
             id="executorsPanel">

            <h2>
                Исполнители
            </h2>

            <!-- FILTER -->
            <select id="executorFilter"
                    onchange="renderExecutors()">

                <option value="all">
                    Все категории
                </option>

                <option value="Для дома">
                    Для дома
                </option>

                <option value="Доставка">
                    Доставка
                </option>

                <option value="Работы">
                    Работы
                </option>

                <option value="Другое">
                    Другое
                </option>

            </select>

            <button class="loginBtn"
                    onclick="toggleExecutors()">
                Показать исполнителей
            </button>

            <div id="executorsList"
                 class="hidden"></div>

        </div>

        <!-- FILTER -->
        <div class="card hidden"
             id="filterPanel">

            <h2>
                Категории заказов
            </h2>

            <select id="categoryFilter"
                    onchange="renderOrders()">

                <option value="all">
                    Все категории
                </option>

                <option value="Для дома">
                    Для дома
                </option>

                <option value="Доставка">
                    Доставка
                </option>

                <option value="Работы">
                    Работы
                </option>

                <option value="Другое">
                    Другое
                </option>

            </select>

        </div>

        <!-- ORDERS -->
        <div class="card">

            <h2>
                Все заказы
            </h2>

            <div id="ordersList"></div>

        </div>

    </div>

</div>

<script>

let users =
    JSON.parse(localStorage.getItem("users")) || [];

let orders =
    JSON.parse(localStorage.getItem("orders")) || [];

let currentUser =
    JSON.parse(localStorage.getItem("currentUser")) || null;

/* ADMIN */
if(!users.find(u => u.username === "admin")){

    users.push({
        username:"admin",
        password:"admin",
        role:"admin"
    });

    saveUsers();
}

/* SAVE */
function saveUsers(){
    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );
}

function saveOrders(){
    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );
}

function saveCurrentUser(){
    localStorage.setItem(
        "currentUser",
        JSON.stringify(currentUser)
    );
}

/* УДАЛИ СТАРУЮ function register() */


/* ВСТАВЬ ВМЕСТО НЕЁ */

function openRegisterModal(){

    document.getElementById("registerModal")
        .classList.remove("hidden");
}

function closeRegisterModal(){

    document.getElementById("registerModal")
        .classList.add("hidden");
}

function registerUser(){

    const username =
        document.getElementById("regUsername")
        .value.trim();

    const password =
        document.getElementById("regPassword")
        .value.trim();

    const password2 =
        document.getElementById("regPassword2")
        .value.trim();

    const role =
        document.getElementById("regRole")
        .value;

    if(!username || !password || !password2){

        alert("Заполните все поля");
        return;
    }

    if(password !== password2){

        alert("Пароли не совпадают");
        return;
    }

    if(username === "admin"){

        alert("Этот логин запрещен");
        return;
    }

    const exists =
        users.find(u => u.username === username);

    if(exists){

        alert("Пользователь уже существует");
        return;
    }

    users.push({

        username,
        password,
        role,

        subscription:false,

        profile:{
            name:"",
            phone:"",
            location:"",
            category:"",
            description:""
        }
    });

    saveUsers();

    alert("Регистрация успешна");

    closeRegisterModal();

    document.getElementById("regUsername").value = "";
    document.getElementById("regPassword").value = "";
    document.getElementById("regPassword2").value = "";
}

/* LOGIN */
function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const user =
        users.find(u =>
            u.username === username &&
            u.password === password
        );

    if(!user){
        alert("Неверный логин или пароль");
        return;
    }

    currentUser = user;

    saveCurrentUser();

    showApp();
}

/* LOGOUT */
function logout(){

    currentUser = null;

    localStorage.removeItem("currentUser");

    document.getElementById("authBlock")
        .classList.remove("hidden");

    document.getElementById("app")
        .classList.add("hidden");
}

/* SHOW */
function showApp(){

    document.getElementById("authBlock")
        .classList.add("hidden");

    document.getElementById("app")
        .classList.remove("hidden");

    document.getElementById("currentUser")
        .innerText = currentUser.username;

    let roleText = "";

    if(currentUser.role === "customer"){
        roleText = "Заказчик";
    }

    if(currentUser.role === "executor"){
        roleText = "Исполнитель";
    }

    if(currentUser.role === "admin"){
        roleText = "Администратор";
    }

    document.getElementById("currentRole")
        .innerText = roleText;

    /* CUSTOMER */
    if(currentUser.role === "customer"){

        document.getElementById("customerPanel")
            .classList.remove("hidden");

        document.getElementById("executorsPanel")
            .classList.remove("hidden");

    }else{

        document.getElementById("customerPanel")
            .classList.add("hidden");

        document.getElementById("executorsPanel")
            .classList.add("hidden");
    }

    /* EXECUTOR */
    if(currentUser.role === "executor"){

        document.getElementById("subscriptionPanel")
            .classList.remove("hidden");

        document.getElementById("executorProfilePanel")
            .classList.remove("hidden");

        document.getElementById("filterPanel")
            .classList.remove("hidden");

        updateSubscriptionStatus();

        loadExecutorProfile();

    }else{

        document.getElementById("subscriptionPanel")
            .classList.add("hidden");

        document.getElementById("executorProfilePanel")
            .classList.add("hidden");

        document.getElementById("filterPanel")
            .classList.add("hidden");
    }

    renderOrders();
}

/* PROFILE SAVE */
function saveExecutorProfile(){

    currentUser.profile = {

        name:
            document.getElementById("executorName").value,

        phone:
            document.getElementById("executorPhone").value,

        location:
            document.getElementById("executorLocation").value,

        category:
            document.getElementById("executorCategory").value,

        description:
            document.getElementById("executorDescription").value
    };

    users = users.map(u => {

        if(u.username === currentUser.username){

            u.profile = currentUser.profile;
        }

        return u;
    });

    saveUsers();

    saveCurrentUser();

    alert("Профиль сохранен");
}

/* LOAD PROFILE */
function loadExecutorProfile(){

    if(!currentUser.profile){
        return;
    }

    document.getElementById("executorName").value =
        currentUser.profile.name || "";

    document.getElementById("executorPhone").value =
        currentUser.profile.phone || "";

    document.getElementById("executorLocation").value =
        currentUser.profile.location || "";

    document.getElementById("executorCategory").value =
        currentUser.profile.category || "Для дома";

    document.getElementById("executorDescription").value =
        currentUser.profile.description || "";
}

/* EXECUTORS */
function toggleExecutors(){

    const list =
        document.getElementById("executorsList");

    list.classList.toggle("hidden");

    renderExecutors();
}

function renderExecutors(){

    const list =
        document.getElementById("executorsList");

    list.innerHTML = "";

    let executors =
    users.filter(u =>
        u.role === "executor" &&
        u.subscription === true
    );

    const category =
        document.getElementById("executorFilter").value;

    if(category !== "all"){

        executors =
            executors.filter(e =>
                e.profile?.category === category
            );
    }

    if(executors.length === 0){

        list.innerHTML =
            "<p style='margin-top:15px;color:#9ca3af;'>Исполнителей нет</p>";

        return;
    }

    executors.forEach(executor => {

        const div =
            document.createElement("div");

        div.className = "profileCard";

        div.innerHTML = `

            <div class="badge">
                ${executor.profile?.category || "Без категории"}
            </div>

            <div class="profileName">
                ${executor.profile?.name || executor.username}
            </div>

            <div class="profileInfo">

                📍 ${executor.profile?.location || "Не указано"}

                <br>

                📞 ${executor.profile?.phone || "Не указано"}

                <br><br>

                ${executor.profile?.description || "Нет информации"}

            </div>

        `;

        list.appendChild(div);
    });
}

/* SUB */
function updateSubscriptionStatus(){

    const status =
        document.getElementById("subscriptionStatus");

    if(currentUser.subscription){

        status.innerHTML = `
            <div style="color:#86efac;margin-top:10px;">
                Подписка активна ✔
            </div>
        `;

    }else{

        status.innerHTML = `
            <div style="color:#fca5a5;margin-top:10px;">
                Подписка не активна
            </div>
        `;
    }
}

/* BUY */
function buySubscription(){

    currentUser.subscription = true;

    users = users.map(u => {

        if(u.username === currentUser.username){

            u.subscription = true;
        }

        return u;
    });

    saveUsers();

    saveCurrentUser();

    updateSubscriptionStatus();

    renderOrders();

    alert("Подписка активирована");
}

/* CREATE ORDER */
function createOrder(){

    const title =
        document.getElementById("orderTitle").value;

    const category =
        document.getElementById("orderCategory").value;

    const description =
        document.getElementById("orderDescription").value;

    const price =
        document.getElementById("orderPrice").value;

    const place =
        document.getElementById("orderPlace").value;

    const contact =
        document.getElementById("orderContact").value;

    if(
        !title ||
        !description ||
        !price ||
        !place ||
        !contact
    ){
        alert("Заполните поля");
        return;
    }

    orders.unshift({

        id:Date.now(),

        title,
        category,
        description,
        price,
        place,
        contact,

        customer:currentUser.username,

        acceptedBy:null,

        published:false
    });

    saveOrders();

    renderOrders();

    document.getElementById("orderTitle").value="";
    document.getElementById("orderDescription").value="";
    document.getElementById("orderPrice").value="";
    document.getElementById("orderPlace").value="";
    document.getElementById("orderContact").value="";
}

/* ACCEPT */
function acceptOrder(id){

    if(!currentUser.subscription){

        alert("Нужна подписка 15€/месяц");
        return;
    }

    const order =
        orders.find(o => o.id === id);

    if(order.acceptedBy){
        alert("Заказ уже принят");
        return;
    }

    order.acceptedBy =
        currentUser.username;

    saveOrders();

    renderOrders();
}

/* PUBLISH */
function publishOrder(id){

    const order =
        orders.find(o => o.id === id);

    order.published = true;

    saveOrders();

    renderOrders();
}

/* DELETE */
function deleteOrder(id){

    orders =
        orders.filter(o => o.id !== id);

    saveOrders();

    renderOrders();
}

/* RENDER ORDERS */
function renderOrders(){

    const list =
        document.getElementById("ordersList");

    list.innerHTML = "";

    let visibleOrders = orders;

    /* EXECUTOR */
    if(currentUser.role === "executor"){

        if(!currentUser.subscription){

            list.innerHTML = `
                <div class="notPublished">
                    Для просмотра заказов нужна подписка
                </div>
            `;

            return;
        }

        visibleOrders =
            orders.filter(o => o.published);

        const category =
            document.getElementById("categoryFilter").value;

        if(category !== "all"){

            visibleOrders =
                visibleOrders.filter(o =>
                    o.category === category
                );
        }
    }

    /* CUSTOMER */
    if(currentUser.role === "customer"){

        visibleOrders =
            orders.filter(o =>
                o.customer === currentUser.username
            );
    }

    if(visibleOrders.length === 0){

        list.innerHTML =
            "<p style='color:#9ca3af;'>Заказов нет</p>";

        return;
    }

    visibleOrders.forEach(order => {

        const div =
            document.createElement("div");

        div.className = "order";

        div.innerHTML = `

            <div class="badge">
                ${order.category}
            </div>

            <h3>${order.title}</h3>

            <br>

            <p>
                <b>Описание:</b><br>
                ${order.description}
            </p>

            <br>

            <p>
                <b>Место:</b>
                ${order.place}
            </p>

            <p>
                <b>Контакты:</b>
                ${order.contact}
            </p>

            <p>
                <b>Заказчик:</b>
                ${order.customer}
            </p>

            <div class="price">
                ${order.price} €
            </div>

        `;

        if(!order.published){

            div.innerHTML += `
                <div class="notPublished">
                    Ожидает публикации админом
                </div>
            `;
        }

        if(order.acceptedBy){

            div.innerHTML += `
                <div class="accepted">
                    Заказ принял:
                    ${order.acceptedBy}
                </div>
            `;
        }

        /* EXECUTOR */
        if(
            currentUser.role === "executor" &&
            order.published &&
            !order.acceptedBy
        ){

            const btn =
                document.createElement("button");

            btn.className = "loginBtn";

            btn.innerText =
                "Принять заказ";

            btn.onclick = () =>
                acceptOrder(order.id);

            div.appendChild(btn);
        }

        /* ADMIN */
        if(currentUser.role === "admin"){

            const panel =
                document.createElement("div");

            panel.className = "adminPanel";

            if(!order.published){

                const publishBtn =
                    document.createElement("button");

                publishBtn.className =
                    "publishBtn";

                publishBtn.innerText =
                    "Опубликовать";

                publishBtn.onclick = () =>
                    publishOrder(order.id);

                panel.appendChild(publishBtn);
            }

            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "deleteBtn";

            deleteBtn.innerText =
                "Удалить";

            deleteBtn.onclick = () =>
                deleteOrder(order.id);

            panel.appendChild(deleteBtn);

            div.appendChild(panel);
        }

        list.appendChild(div);
    });
}

/* AUTO LOGIN */
if(currentUser){
    showApp();
}

</script>
